apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{ .Values.LabelKey }}: {{ .Values.LabelValue }}
  strategy:
    type: {{ .Values.strategy.type }}
{{- if eq .Values.strategy.type "RollingUpdate" }}
    rollingUpdate:
      maxSurge: {{ .Values.strategy.rollingUpdate.maxSurge }}
      maxUnavailable: {{ .Values.strategy.rollingUpdate.maxUnavailable }}
{{- end }}
  template:
    metadata:
      labels:
        {{ .Values.LabelKey }}: {{ .Values.LabelValue }}
    spec:
      containers:
        - name: {{ .Values.containers.name }}
          image: "{{ .Values.containers.image }}:{{ .Values.containers.tag }}"
          imagePullPolicy: {{ .Values.containers.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.containers.port }}
              protocol: {{ .Values.containers.protocol }}
          {{- if .Values.containers.resources }}
          resources:
            {{- if .Values.containers.resources.requests }}
            requests:
              cpu: {{ .Values.containers.resources.requests.cpu }}
              memory: {{ .Values.containers.resources.requests.memory }}
            {{- end }}
            {{- if .Values.containers.resources.limits }}
            limits:
              cpu: {{ .Values.containers.resources.limits.cpu }}
              memory: {{ .Values.containers.resources.limits.memory }}
            {{- end }}
          {{- end }}
